openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# STATUS: draft. This file describes the exchange the ARIA authority implements
# today. TLF has not yet adopted it as the normative federation contract; until it
# does, names and shapes may still change, and the authority's behaviour is the
# reference for what this draft describes.
#
# This is the contract between a Registration Authority and the ARIA authority.
# It is published because federation is impossible without it: a prospective RA
# cannot evaluate a contract it is not allowed to read. Publishing it reveals what
# the authority asks for, not how it signs.
#
# The shapes live in exchange.schema.json. The shared exchanges under
# conformance/federation are checked against both files and replayed against the
# authority.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: ARIA Authority Contract
  version: 1.0.0-draft
  summary: What a Registration Authority may ask of the ARIA authority, and what it answers.
  description: |
    ARIA follows the Certificate Authority / Registration Authority model.

    The **authority** checks the request and signs. It never sees personally
    identifiable information: no KYC documents, no customer records, no identity
    evidence. The **Registration Authority** vets the principal to the level it
    requests and **attests** to the checks it performed, under its signature. The
    authority signs on the strength of that attestation, and keeps it with its
    signature: responsibility for the vetting stays with the RA.

    ## Authentication

    Every request is a signed envelope: `assertion`, `signature`, `payload`.

    - The assertion (`ctx: aria-ra-request-v1`) names the RA, the audience (the
      authority's DID), the operation, a `request_id`, a short validity window (five
      minutes by default) and the SHA-256 digest of the payload's canonical JSON
      (RFC 8785).
    - `signature.value` is a composite signature over the assertion's canonical JSON,
      by the RA key named in `signature.kid`: ML-DSA-65 and Ed25519, both required.
      One valid half is a refusal.
    - The key must be registered for that RA, and the RA accredited, active, and
      accredited for the level it asks. Accreditation is set by the authority's
      operator; this contract has no operation for it.

    The payload is read only after the signature, the window and the digest have
    passed, so a request that fails authentication is never judged on its content.
    Mutual TLS and network placement are deployment layers outside this contract:
    the authority is reached on a private network, never from the internet.

    ## Retries

    The authority records a **successful** answer with the request, in the same
    transaction, under the RA and its `request_id`. A refusal is recorded nowhere.

    - **Recovering an answer:** resend the same operation with the same
      `request_id` and the same payload. If it was recorded, the recorded answer
      comes back and nothing is done again, even after the reservation or the
      original assertion has expired. The resent request must authenticate now: when
      the original window has passed, sign a fresh assertion for the same
      `request_id` and payload, with a key that is still registered and active, from
      an RA still in good standing.
    - **If it was not recorded,** the resent request is judged afresh, against the
      state at that moment: it may succeed, or be refused for a reason the first
      attempt did not meet (an expired reservation, for instance).
    - The same `request_id` with another payload is `request_id_conflict`.

    An answer that never arrived (a 504, a lost connection) or a 500 or 503
    `unavailable` leaves the outcome **unknown**: the database may have committed
    the request even though its acknowledgement was lost. The RA keeps the request
    unresolved and resends the same request until it gets the recorded answer or a
    refusal of the request itself. A resend refused before its payload is judged
    (401, or 403 `ra_not_in_good_standing`) says nothing about the original. The RA
    never treats an unresolved request as not done, and never sends a new one with
    another `request_id` to find out.

    ## Refusals

    A refusal carries `code`, `path` (a JSON pointer built from names this contract
    defines; an unknown member is reported at its parent), `correlation_id` and, once
    the request signature has verified, `request_id`. Nothing from the request is
    echoed, and no refusal reveals another RA's reservations, credentials or
    bindings. Each code travels with one HTTP status, listed below and in
    `exchange.schema.json` (`refusal400` … `refusal503`).

    ## Not in this draft

    Public reads (credentials, status lists) are served by the authority's public
    API, not by this contract. A published key set for the authority is pending: no
    endpoint serves one yet. The scope catalogue is kept by each registry: the
    authority checks a scope's form only. A queryable RA standing endpoint is not
    implemented.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: '{origin}'
    description: The authority, on its private network. There is no public host.
    variables:
      origin:
        default: https://authority.internal

tags:
  - name: issuance
    description: Reserving a DID, signing a credential, revoking it
  - name: domain binding
    description: Binding a domain to a principal for L1 issuance

paths:

  /v1/authority/reserve:
    post:
      tags: [issuance]
      operationId: reserve
      summary: Reserve a DID for one agent
      description: |
        First half of a two-phase issuance. A reservation holds the DID for the RA
        that asked, for a limited time (15 minutes by default), and returns the
        possession challenge the agent signs in its statement. Two RAs cannot
        reserve one DID.

        - **L0**: a registry-form DID (`did:aria:<host>:u-<account>:<agent>`) whose
          account is the principal's, under an account no other RA manages.
        - **L1**: a domain-form DID (`did:aria:<domain>:<agent>`), whose domain the
          principal has bound (`domain-bind`) and the authority has seen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'exchange.schema.json#/$defs/reserveRequest' }
      responses:
        '200':
          description: Reserved
          content:
            application/json:
              schema: { $ref: 'exchange.schema.json#/$defs/reserveResponse' }
        '400': { $ref: '#/components/responses/MalformedJson' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Refused' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/NoAnswer' }

  /v1/authority/mint:
    post:
      tags: [issuance]
      operationId: mint
      summary: Sign the credential for a reservation
      description: |
        Second half of the issuance. The payload carries the agent's statement,
        signed by the agent's own keys over the reservation's challenge, and the RA's
        attestation, signed by the RA.

        The authority checks, without any personal data: the statement against the
        reservation; both halves of the agent's signature (possession of the keys it
        declares); the attestation's signature by the RA's registered key; its window
        and that it is used once; the checks the level requires, their outcomes and
        their ages; that HITL scopes are among the scopes; and, at L1, that the
        domain binding's record is still published. The RA's own validation does not
        exempt any of these.

        The answer is the signed ARIA Identity Document, with its status list index.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'exchange.schema.json#/$defs/mintRequest' }
      responses:
        '200':
          description: Signed
          content:
            application/json:
              schema: { $ref: 'exchange.schema.json#/$defs/mintResponse' }
        '400': { $ref: '#/components/responses/MalformedJson' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Refused' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/NoAnswer' }

  /v1/authority/revoke:
    post:
      tags: [issuance]
      operationId: revoke
      summary: Revoke a credential
      description: |
        By the RA that issued the credential or the RA that now manages its account.
        The revocation is committed with the answer and appears in the next signed
        status list. A credential is revoked once; a credential this RA may not see
        is `credential_unknown` or `revocation_not_permitted`, never a description
        of another RA's records.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'exchange.schema.json#/$defs/revokeRequest' }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: 'exchange.schema.json#/$defs/revokeResponse' }
        '400': { $ref: '#/components/responses/MalformedJson' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Refused' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/NoAnswer' }

  /v1/authority/domain-bind:
    post:
      tags: [domain binding]
      operationId: domainBind
      summary: Bind a domain to a principal
      description: |
        Returns the record the principal publishes once for every agent:
        `_aria-bind.<domain> TXT "v=ARIABIND1; b=<token>"`. The token stands for
        this RA, principal and domain only; the record names none of them. Binding
        again returns the live binding with the same token; an expired one is
        replaced by a new binding with a new token. Requires an RA accredited for L1
        and a principal account no other RA manages.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'exchange.schema.json#/$defs/domainBindRequest' }
      responses:
        '200':
          description: The binding
          content:
            application/json:
              schema: { $ref: 'exchange.schema.json#/$defs/bindingResponse' }
        '400': { $ref: '#/components/responses/MalformedJson' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Refused' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/NoAnswer' }

  /v1/authority/domain-check:
    post:
      tags: [domain binding]
      operationId: domainCheck
      summary: Read a binding's record now
      description: |
        The authority reads the record over authenticated DNS-over-HTTPS and keeps
        the read. The answer's `binding.observed` is that read: `present`, `absent`
        or `unavailable`, with whether the resolver authenticated it (DNSSEC). A
        binding seen once is `active`. Another RA's binding is
        `domain_binding_unknown`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'exchange.schema.json#/$defs/domainCheckRequest' }
      responses:
        '200':
          description: The binding, with the read just made
          content:
            application/json:
              schema: { $ref: 'exchange.schema.json#/$defs/bindingResponse' }
        '400': { $ref: '#/components/responses/MalformedJson' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/UnknownBinding' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Refused' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/NoAnswer' }

  /v1/authority/domain-unbind:
    post:
      tags: [domain binding]
      operationId: domainUnbind
      summary: End a binding
      description: |
        No reservation or issuance under the binding from then on. Credentials it
        helped issue are untouched: revoking them is its own request. An ended
        binding never changes again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'exchange.schema.json#/$defs/domainUnbindRequest' }
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema: { $ref: 'exchange.schema.json#/$defs/unbindResponse' }
        '400': { $ref: '#/components/responses/MalformedJson' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/UnknownBinding' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Refused' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/NoAnswer' }

components:

  responses:
    MalformedJson:
      description: >-
        The body is not a single JSON object the authority can read (syntax, a
        duplicate member, excessive depth).
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal400' }
    NotAuthenticated:
      description: >-
        The request's assertion or signature did not verify. The payload was not
        read.
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal401' }
    NotPermitted:
      description: >-
        The RA is not in good standing, not accredited for the level, or may not act
        on that account or credential.
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal403' }
    UnknownBinding:
      description: >-
        No binding of this RA has that identifier. Another RA's binding is answered
        the same way.
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal404' }
    Conflict:
      description: >-
        The request contradicts a recorded state: another payload under the same
        request_id, a DID already reserved or issued, a reservation or attestation
        already used, a credential already revoked, a binding already ended.
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal409' }
    TooLarge:
      description: >-
        The body exceeds the authority's limit (32 KiB by default) and was not read.
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal413' }
    Refused:
      description: >-
        The request's content was refused, at the path given.
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal422' }
    InternalError:
      description: >-
        The authority failed while answering. Nothing of the request is in the
        answer or the log. The outcome is unknown: resend the same request.
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal500' }
    Unavailable:
      description: >-
        A dependency did not answer. `signer_unavailable` (the signer) and
        `domain_binding_unavailable` (the DNS resolver) are given before the request
        is recorded: resending it judges it afresh. `unavailable` (the database)
        leaves the outcome unknown, since the failure may come after a commit whose
        acknowledgement was lost: resend the same request to learn its recorded
        answer.
      content:
        application/json:
          schema: { $ref: 'exchange.schema.json#/$defs/refusal503' }
    NoAnswer:
      description: >-
        No answer within 30 seconds, and no body. The outcome is unknown: resend
        the same request to learn its recorded answer.
