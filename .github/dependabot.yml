# Updates land on dev, never on main, and never as a flood.
#
# The cryptographic dependencies are invariants, not upgrades: the suite
# mldsa65-ed25519-2026 is fixed by INVARIANTS.md §2 and by credentials already
# signed. A bot does not move them. Major versions of anything are reviewed by a
# person, so they are ignored here and raised deliberately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /sdk/verify-ts
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    commit-message: { prefix: chore }
    groups:
      sdk-dev-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@noble/*"
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    commit-message: { prefix: chore }
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
