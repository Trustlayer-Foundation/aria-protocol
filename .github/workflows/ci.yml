name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions: {}

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/verify-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: sdk/verify-ts
      - run: pnpm test
        working-directory: sdk/verify-ts

  conformance:
    # The vectors are the contract between implementations, so they run on every
    # change. The harness needs the SDK built, since it tests the published entry
    # point rather than the source, and a JSON-LD processor, because the expansion
    # check has to be run by something that implements the specification. --strict
    # turns a missing processor into a failure: a check that quietly skips proves
    # nothing.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/verify-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: sdk/verify-ts
      - run: pnpm build
        working-directory: sdk/verify-ts
      - run: npm install --no-audit --no-fund
        working-directory: conformance
      - run: node run.mjs --strict
        working-directory: conformance

  identity-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check the commits the author wrote, not the ephemeral merge commit
          # GitHub builds for the pull request: that one carries no sign-off and
          # nobody authored it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash .github/scripts/identity-guard.sh "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.event.pull_request.head.sha || github.sha }}"

  neutrality:
    # The Norm defines properties, never vendors or schemes. Retired spellings
    # stay allowed in CHANGELOG and DEPRECATIONS: recording what was retired is
    # the point of those two files.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          # .github holds this guard's own pattern; CHANGELOG and DEPRECATIONS
          # record what was retired. None of the three is normative text.
          ! grep -rniE "vLEI|GLEIF|iBeta|IAL2 equivalent|Beyond EV|StatusList ?2021|ecdsa|P-256" \
              --include='*.md' --include='*.json' --include='*.ts' \
              --exclude-dir=node_modules --exclude-dir=.github \
              --exclude=CHANGELOG.md --exclude=DEPRECATIONS.md .

  branch-name:
    # Branch naming is a convention, not an Enterprise metadata rule. Pull
    # requests only; a push to dev or main has no head ref to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          # Release pull requests come from dev or from release/<topic>; the naming
          # convention is for the branches where work happens, not for publishing.
          echo "${{ github.head_ref }}" | grep -qE '^(dev|(spec|sdk|docs|fix|chore|release)/[a-z0-9._-]+)$' \
            || { echo "::error::branch '${{ github.head_ref }}' must be dev or match (spec|sdk|docs|fix|chore|release)/<topic>"; exit 1; }
